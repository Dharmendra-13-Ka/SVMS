<!DOCTYPE html>
<html>

<head>

    <title>SVMS Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .success-popup {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .success-box {

            background: white;

            padding: 30px 45px;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .success-icon {

            width: 60px;
            height: 60px;

            margin: auto;

            border-radius: 50%;

            background: #28a745;

            color: white;

            font-size: 40px;

            line-height: 60px;
        }

        .success-box h2 {

            margin-bottom: 5px;
        }

        .success-box p {

            color: #666;
        }

    </style>

</head>

<body>

<!-- LOGIN SUCCESS POPUP -->

<div id="successPopup" class="success-popup">

    <div class="success-box">

        <div class="success-icon">✓</div>

        <h2>Login Successful</h2>

        <p>Welcome to SVMS Dashboard</p>

    </div>

</div>


<center>

<br><br><br>

<h1>SMART VOLTAGE MONITORING SYSTEM</h1>

<h2>Admin Login</h2>

<br>

<input
type="text"
id="username"
placeholder="Username"
>

<br><br>

<input
type="password"
id="password"
placeholder="Password"
>

<br><br>

<button onclick="login()">

LOGIN

</button>

<br><br>

<p id="message"></p>

</center>

<script src="login.js"></script>

</body>

</html>
