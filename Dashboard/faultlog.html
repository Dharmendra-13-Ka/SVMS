<!DOCTYPE html>
<html>

<head>

    <title>SVMS Fault Log</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1 align="center">
        SMART VOLTAGE MONITORING SYSTEM
    </h1>

    <h2 align="center">
        Fault Log History
    </h2>

    <center>

        <table border="1" width="95%" id="faultTable">

            <tr>

                <th>Date</th>

                <th>Fault Start</th>

                <th>Start Voltage</th>

                <th>Fault</th>

                <th>Relay</th>

                <th>Fault Resolve</th>

                <th>Resolve Voltage</th>

                <th>Duration</th>

                <th>Status</th>

            </tr>

        </table>

        <br>

        <a href="index.html">

            <button>
                Back To Dashboard
            </button>

        </a>

    </center>


    <script src="faultlog.js"></script>

</body>

</html>
